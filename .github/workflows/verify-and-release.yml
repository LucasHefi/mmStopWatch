name: verify-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Check Tauri backend
        run: npm run tauri:check

  package:
    name: Package (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            bundles: deb,appimage
            tauri_config: ''
          - platform: macos
            os: macos-latest
            bundles: dmg,app
            tauri_config: ''
          - platform: windows
            os: windows-latest
            bundles: nsis,msi
            tauri_config: '--config src-tauri/target/tauri.windows.rc.json'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows MSI-compatible version overlay
        id: prepare_windows_bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundleVersion = node --input-type=module -e 'import fs from "node:fs"; const { version } = JSON.parse(fs.readFileSync("package.json", "utf8")); const match = version.match(/^(\d+\.\d+\.\d+)-.*?(\d+)$/); if (!match) throw new Error(`Cannot derive numeric Windows bundle version from ${version}`); process.stdout.write(match[1] + "-" + match[2]);'
          New-Item -ItemType Directory -Force -Path src-tauri/target | Out-Null
          @{ version = $bundleVersion } | ConvertTo-Json -Compress | Set-Content -Path src-tauri/target/tauri.windows.rc.json -Encoding utf8
          "bundle_version=$bundleVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }} --ci ${{ matrix.tauri_config }}

      - name: Generate release metadata
        env:
          MMSTOPWATCH_BUNDLE_VERSION: ${{ steps.prepare_windows_bundle.outputs.bundle_version }}
        run: node scripts/generate-release-metadata.mjs

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: mmStopWatch-${{ matrix.platform }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

      - name: Cleanup Windows version overlay
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: Remove-Item -Force src-tauri/target/tauri.windows.rc.json -ErrorAction SilentlyContinue

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          find_one() {
            local platform="$1"
            local pattern="$2"
            local matches=()
            while IFS= read -r file; do
              matches+=("$file")
            done < <(find "artifacts/mmStopWatch-${platform}" -type f -name "$pattern" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'Expected exactly one %s asset for %s, found %s\n' "$pattern" "$platform" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf '%s' "${matches[0]}"
          }

          copy_asset() {
            local source="$1"
            local target="$2"
            [[ ! -e "release-assets/${target}" ]] || { printf 'Duplicate staged asset: %s\n' "$target" >&2; exit 1; }
            cp "$source" "release-assets/${target}"
          }

          copy_asset "$(find_one linux 'mmStopWatch_*.deb')" 'mmStopWatch_linux.deb'
          copy_asset "$(find_one linux 'mmStopWatch_*.AppImage')" 'mmStopWatch_linux.AppImage'
          copy_asset "$(find_one macos 'mmStopWatch_*.dmg')" 'mmStopWatch_macos.dmg'
          copy_asset "$(find_one windows 'mmStopWatch_*-setup.exe')" 'mmStopWatch_windows-setup.exe'
          copy_asset "$(find_one windows 'mmStopWatch_*.msi')" 'mmStopWatch_windows.msi'

          for platform in linux macos windows; do
            copy_asset "$(find_one "$platform" 'SHA256SUMS.txt')" "SHA256SUMS-${platform}.txt"
            copy_asset "$(find_one "$platform" 'BUILD-METADATA.json')" "BUILD-METADATA-${platform}.json"
          done

          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 11
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
