[package]
name = "mmstopwatch-slint"
version = "1.7.0-rc.21"
edition = "2024"
description = "Lightweight native Slint UI for mmStopWatch"
license = "MIT"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
minreq = { version = "2.14.1", default-features = false, features = ["https-rustls"] }
notify = "8.2.0"
rfd = "0.16.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
slint = { version = "1.17.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "software-renderer-systemfonts",
] }
walkdir = "2.5.0"

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
